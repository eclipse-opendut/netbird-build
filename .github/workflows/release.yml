name: Test Code Linux

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.actor_id }}
  cancel-in-progress: true

env:
  netbird_repository: "eclipse-opendut/netbird-fork"
  netbird_ref: "131136439764a67187b7fbfadef1215b5cc66780"
  netbird_version: "v0.60.2"  # git describe --tags | grep -Eo 'v[0-9]+.[0-9]+.[0-9]+'

  GORELEASER_VER: "v2.3.2"
  # do not publish artifacts since this requires secrets of the respective targets
  GORELEASER_FLAGS: "--skip=docker --skip=publish"



jobs:
  # compare with https://github.com/netbirdio/netbird/blob/3f4f825ec14c45dd149a743eb80e98e7bb5e9ec5/.github/workflows/golang-test-linux.yml
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [ '386','amd64' ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          repository: '${{ env.netbird_repository }}'
          ref: '${{ env.netbird_ref }}'

      # Steps taken from test job: .github/workflows/golang-test-linux.yml
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Get Go environment
        run: |
          echo "cache=$(go env GOCACHE)" >> $GITHUB_ENV
          echo "modcache=$(go env GOMODCACHE)" >> $GITHUB_ENV     

      - name: Cache Go modules
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.cache }}
            ${{ env.modcache }}
          key: ${{ runner.os }}-gotest-cache-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gotest-cache-

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y -q libgtk-3-dev libayatana-appindicator3-dev libgl1-mesa-dev xorg-dev gcc-multilib libpcap-dev

      - name: Install 32-bit libpcap
        if: matrix.arch == '386'
        run: sudo dpkg --add-architecture i386 && sudo apt update && sudo apt-get install -y libpcap0.8-dev:i386

      - name: Install modules
        run: go mod tidy

      - name: check git status
        run: git --no-pager diff --exit-code

      - name: Test
        run: CGO_ENABLED=1 GOARCH=${{ matrix.arch }} CI=true go test -tags devcert -exec 'sudo' -timeout 10m -p 1 $(go list ./... | grep -v -e /management -e /signal -e /relay)

  release:
    # compare with https://github.com/netbirdio/netbird/blob/3f4f825ec14c45dd149a743eb80e98e7bb5e9ec5/.github/workflows/golang-test-linux.yml
    runs-on: ubuntu-latest
    needs: [ "test" ]
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          repository: '${{ env.netbird_repository }}'
          ref: '${{ env.netbird_ref }}'

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: "${{ env.go_version }}"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-releaser-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-releaser-

      - name: Install modules
        run: go mod tidy

      - name: Install OS build dependencies
        run: sudo apt update && sudo apt install -y -q gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu

      - name: Set custom git tag - the custom NetBird release version
        run: |
          git tag ${{ env.netbird_version }}-${{ env.netbird_ref }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          version: ${{ env.GORELEASER_VER }}
          args: release --clean ${{ env.GORELEASER_FLAGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          retention-days: 3

      - uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b  # v1.20.0
        name: "Create release"
        with:
          artifacts: "dist/netbird*.tar.gz,client/proto/daemon.proto"
          tag: "${{ env.netbird_version }}-${{ env.netbird_ref }}"
